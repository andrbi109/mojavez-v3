# mojavez-v3 — Apache vhost.
# Per docs/00-MASTER.md §16.6.
# Install: sudo cp deploy/apache/mojavez.conf /etc/apache2/sites-available/
#          sudo a2ensite mojavez && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName mojavez.example.com
    DocumentRoot /var/www/mojavez-v3/public

    <Directory /var/www/mojavez-v3/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Upload size limit (2 MiB docs, 5 MiB CSV — 8 MiB ceiling).
    LimitRequestBody 8388608

    # Security headers (defense in depth — app also emits them).
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"

    # Logs.
    ErrorLog  ${APACHE_LOG_DIR}/mojavez_error.log
    CustomLog ${APACHE_LOG_DIR}/mojavez_access.log combined

    # Pass real IP through (if behind nginx/CDN).
    RemoteIPHeader X-Forwarded-For
    RemoteIPTrustedProxy 127.0.0.1 ::1
</VirtualHost>
