# mojavez-v3 — nginx reverse proxy for the `web` service in docker-compose.
# Per docs/00-MASTER.md §16.2 — sits in front of the `app` (Apache) container.
# All requests are proxied to app:80; nginx handles TLS termination in production
# (mount certs + uncomment the ssl server block).

upstream mojavez_app {
    server app:80;
}

server {
    listen 80;
    server_name _;

    # Security headers (defense in depth — Apache also emits them).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    client_max_body_size 8M;

    location / {
        proxy_pass http://mojavez_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Static assets — Apache serves them; no need to bypass.
    location /assets/ {
        proxy_pass http://mojavez_app;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Health check passthrough.
    location = /health {
        proxy_pass http://mojavez_app;
        access_log off;
    }
}

