# mojavez-v3 — docker-compose (3 services: db + app + web).
# Per docs/00-MASTER.md §16.2.
#
# Usage:
#   cd deploy/docker
#   cp .env.example .env   # edit DB password + MOJAVEZ_PORT
#   docker compose up -d --build
#   docker compose logs -f app   # watch migration progress
#   # open http://localhost:${MOJAVEZ_PORT:-8080}/

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-mojavez_root}
      MARIADB_DATABASE: ${DB_NAME:-mojavez_v3}
      MARIADB_USER: ${DB_USER:-mojavez}
      MARIADB_PASSWORD: ${DB_PASSWORD:-mojavez_pass}
    volumes:
      - mojavez-v3-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-mojavez_v3}
      DB_USER: ${DB_USER:-mojavez}
      DB_PASSWORD: ${DB_PASSWORD:-mojavez_pass}
      APP_ENV: ${APP_ENV:-production}
      INIT_DB: ${INIT_DB:-1}
      CRON_SECRET: ${CRON_SECRET:-}
      SYNC_SECRET: ${SYNC_SECRET:-}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - mojavez-v3-uploads:/var/www/html/uploads
      - ../../storage/logs:/var/www/html/storage/logs
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "${MOJAVEZ_PORT:-8080}:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  mojavez-v3-db-data:
  mojavez-v3-uploads:
