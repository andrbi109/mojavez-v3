# mojavez-v3 — Nginx server block.
# Per docs/00-MASTER.md §16.7.
# Install: sudo cp deploy/nginx/mojavez.conf /etc/nginx/sites-available/
#          sudo ln -s /etc/nginx/sites-available/mojavez.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name mojavez.example.com;
    root /var/www/mojavez-v3/public;
    index index.php;

    client_max_body_size 8M;

    # Security headers (defense in depth — app also emits them).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Path traversal + dotfile protection.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Main rewrite — send everything to index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM.
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60s;
    }

    # Static assets — cache.
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        log_not_found off;
    }

    # Health check — no logging.
    location = /health {
        access_log off;
    }
}
