name: CI

# mojavez-v3 — CI pipeline.
# Per docs/00-MASTER.md §27 (Contract Test, CI/CD, Structured Logging).
#
# Runs on every push and pull request:
#   job `test`: lint + static analysis + unit tests + pattern matcher + smoke (--no-http)
#   job `smoke`: full HTTP smoke test (only on main, needs a running server)
#
# MariaDB is a service container so DB-backed tests run.

on:
  push:
    branches: [main, 'phase/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: mojavez_v3
          MARIADB_USER: mojavez
          MARIADB_PASSWORD: mojavez_pass
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, fileinfo, gd, curl, zip
          coverage: none

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show PHP version
        run: php -v

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u mojavez -pmojavez_pass --silent 2>/dev/null; then
              echo "MariaDB is up"; exit 0
            fi
            sleep 1
          done
          echo "MariaDB did not come up"; exit 1

      - name: Create .env
        run: |
          cp .env.example .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/^DB_NAME=.*/DB_NAME=mojavez_v3/' .env
          sed -i 's/^DB_USER=.*/DB_USER=mojavez/' .env
          sed -i 's/^DB_PASS=.*/DB_PASS=mojavez_pass/' .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env

      - name: Apply migrations
        run: php scripts/migrate.php --all

      - name: Setup v2_src_ source tables (for MigrateFromV2Test)
        run: php tests/setup_v2_source.php

      - name: Lint all PHP files
        run: |
          fail=0
          while IFS= read -r f; do
            if ! php -l "$f" >/dev/null 2>&1; then
              echo "::error::PHP syntax error in $f"
              fail=1
            fi
          done < <(find app public scripts -name '*.php' -type f)
          exit $fail

      - name: Schema ownership matrix check
        run: python3 tools/check_schema_ownership.py

      - name: Static analysis (0 FAIL required)
        run: |
          python3 tools/static_analysis.py
          # Fail the step if any FAIL line appears (warnings are OK).
          if python3 tools/static_analysis.py 2>&1 | grep -qi "fail"; then
            echo "::error::static analysis reported a FAIL"
            exit 1
          fi

      - name: Unit tests (0 failures required)
        run: php tests/run.php

      - name: Pattern matcher test
        run: python3 scripts/pattern_matcher.py

      - name: Smoke test (--no-http, 0 failures required)
        run: ./tests/smoke-test.sh --no-http

  smoke:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, fileinfo, gd, curl, zip
          coverage: none

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run full smoke test (with HTTP server)
        run: |
          cp .env.example .env || true
          # The smoke-test.sh starts a PHP built-in server and runs HTTP checks.
          bash tests/smoke-test.sh
