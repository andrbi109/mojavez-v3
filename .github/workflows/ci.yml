name: CI

# mojavez-v3 — CI pipeline.
# Per docs/00-MASTER.md §27 (Contract Test, CI/CD, Structured Logging).
#
# Runs on every push and pull request:
#   job `test`: lint + static analysis + unit tests + pattern matcher + smoke (--no-http)
#   job `smoke`: full HTTP smoke test (only on main, needs a running server)
#
# MariaDB is a service container so DB-backed tests run.

on:
  push:
    branches: [main, 'phase/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: mojavez_v3
          MARIADB_USER: mojavez
          MARIADB_PASSWORD: mojavez_pass
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, fileinfo, gd, curl, zip
          coverage: none

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show PHP version
        run: php -v

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u mojavez -pmojavez_pass --silent 2>/dev/null; then
              echo "MariaDB is up"; exit 0
            fi
            sleep 1
          done
          echo "MariaDB did not come up"; exit 1

      - name: Create .env
        run: |
          cp .env.example .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/^DB_NAME=.*/DB_NAME=mojavez_v3/' .env
          sed -i 's/^DB_USER=.*/DB_USER=mojavez/' .env
          sed -i 's/^DB_PASS=.*/DB_PASS=mojavez_pass/' .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env

      - name: Apply migrations
        run: php scripts/migrate.php --all

      - name: Setup v2_src_ source tables (for MigrateFromV2Test)
        run: php tests/setup_v2_source.php

      - name: Lint all PHP files
        run: |
          fail=0
          while IFS= read -r f; do
            if ! php -l "$f" >/dev/null 2>&1; then
              echo "::error::PHP syntax error in $f"
              fail=1
            fi
          done < <(find app public scripts -name '*.php' -type f)
          exit $fail

      - name: Schema ownership matrix check
        run: python3 tools/check_schema_ownership.py

      - name: Static analysis (0 surviving warnings required)
        # Phase 13 (v1.4.0): pays D-1-8. --strict mode + the ignore
        # patterns in tools/static_analysis_ignore.txt are now enforced
        # in CI. The ignore file lists known false-positive patterns
        # (csrfField, $content in layouts, controller-name false
        # positives, SQL string-concat in Connection.php for the
        # allowlist-validated SET NAMES / SET time_zone). Any warning
        # not covered by the ignore list fails the build.
        run: python3 tools/static_analysis.py --strict

      - name: Unit tests (0 failures required)
        run: php tests/run.php

      - name: Contract tests (two-way sync contract, §29.1)
        run: php tests/contract.php

      - name: Pattern matcher test
        run: python3 scripts/pattern_matcher.py

      - name: Smoke test (--no-http, 0 failures required)
        run: ./tests/smoke-test.sh --no-http

      # Phase 13 (v1.4.0): pays D-7-2. database/schema.sql is the
      # canonical idempotent schema (single source of truth for fresh
      # installs). The script scripts/generate_schema_sql.py regenerates
      # it by applying all module migrations to a throwaway DB and
      # dumping SHOW CREATE TABLE. This step regenerates it and fails
      # the build if the result differs from the committed file — so
      # a migration that adds a column but doesn't get its schema.sql
      # updated is caught before merge.
      - name: Schema drift check (database/schema.sql)
        run: |
          python3 scripts/generate_schema_sql.py
          # The generator's write_install() does not include the
          # Phase 12 seed for the 'avatar' document_type (that seed is
          # hand-added to install.sql at the bottom). Restore the
          # committed install.sql so the drift check only flags
          # schema.sql (which is the file we actually want to verify).
          git checkout database/install.sql
          if ! git diff --exit-code -- database/schema.sql; then
            echo "::error::database/schema.sql has drifted from the actual schema. Run 'python3 scripts/generate_schema_sql.py' locally and commit the updated schema.sql."
            git diff -- database/schema.sql | head -50
            exit 1
          fi
          echo "OK: database/schema.sql is in sync with the migrations."

  smoke:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, fileinfo, gd, curl, zip
          coverage: none

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run full smoke test (with HTTP server)
        run: |
          cp .env.example .env || true
          # The smoke-test.sh starts a PHP built-in server and runs HTTP checks.
          bash tests/smoke-test.sh
